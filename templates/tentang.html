{% extends "base.html" %} {% block title %}Tentang{% endblock %} {% block
content %}

<style>
  /* ============================================================
     VARIABEL — konsisten dengan halaman lain
     ============================================================ */
  :root {
    --primary: #3a8c5e;
    --primary-light: #6bb88a;
    --primary-dark: #236b45;
    --primary-bg: #f7fbf8;
    --accent: #e6a43a;
    --accent-light: #f5d48a;
    --gray-50: #f9fafb;
    --gray-200: #e2e6ec;
    --gray-600: #6b7a8e;
    --gray-800: #1e2a3a;
    --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 12px 40px rgba(0, 0, 0, 0.06);
    --radius: 20px;
    --radius-sm: 14px;
    --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  body {
    background: var(--primary-bg);
    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
    color: var(--gray-800);
    -webkit-font-smoothing: antialiased;
  }

  .container-custom {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* --- Kartu Utama --- */
  .card-about {
    border: none;
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: var(--transition);
  }

  .card-about:hover {
    box-shadow: var(--shadow-md);
  }

  .card-about .card-header {
    background: linear-gradient(145deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-weight: 700;
    padding: 1.4rem 2rem;
    border: none;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .card-about .card-header i {
    font-size: 1.6rem;
  }

  .card-about .card-body {
    padding: 2rem 2rem 2.2rem;
  }

  /* --- Judul --- */
  .about-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 1.5rem;
    padding-bottom: 0.8rem;
    border-bottom: 2px solid rgba(58, 140, 94, 0.1);
  }

  /* --- Tabel Informasi --- */
  .info-table {
    width: 100%;
    border-collapse: collapse;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
  }

  .info-table tr {
    border-bottom: 1px solid var(--gray-200);
    transition: var(--transition);
  }

  .info-table tr:last-child {
    border-bottom: none;
  }

  .info-table tr:hover {
    background: rgba(58, 140, 94, 0.03);
  }

  .info-table th {
    padding: 14px 20px;
    font-weight: 600;
    color: var(--gray-600);
    width: 35%;
    text-align: left;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    background: var(--gray-50);
  }

  .info-table td {
    padding: 14px 20px;
    font-weight: 500;
    color: var(--gray-800);
    text-align: left;
  }

  .info-table td .badge-about {
    display: inline-block;
    background: var(--primary-bg);
    color: var(--primary-dark);
    padding: 4px 16px;
    border-radius: 40px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  /* --- Responsif --- */
  @media (max-width: 768px) {
    .card-about .card-header {
      font-size: 1.1rem;
      padding: 1rem 1.5rem;
    }
    .card-about .card-body {
      padding: 1.5rem;
    }
    .about-title {
      font-size: 1.4rem;
    }
    .info-table th,
    .info-table td {
      padding: 10px 14px;
      font-size: 0.9rem;
    }
    .info-table th {
      width: 40%;
    }
  }

  @media (max-width: 480px) {
    .card-about .card-header {
      font-size: 1rem;
      padding: 0.8rem 1.2rem;
    }
    .card-about .card-body {
      padding: 1.2rem;
    }
    .about-title {
      font-size: 1.2rem;
    }
    .info-table th,
    .info-table td {
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    .info-table th {
      width: 45%;
    }
  }
</style>

<!-- ============================================================ -->
<!-- KONTEN TENTANG -->
<!-- ============================================================ -->
<div class="container-custom">
  <div class="card-about">
    <div class="card-header">
      <i class="bi bi-info-circle"></i> Tentang Sistem
    </div>
    <div class="card-body">
      <h3 class="about-title">{{ info.judul }}</h3>

      <table class="info-table">
        <tr>
          <th>Algoritma</th>
          <td><span class="badge-about">{{ info.algoritma }}</span></td>
        </tr>
        <tr>
          <th>Fitur</th>
          <td><span class="badge-about">{{ info.fitur }}</span></td>
        </tr>
        <tr>
          <th>Dataset</th>
          <td>{{ info.dataset }}</td>
        </tr>
        <tr>
          <th>Akurasi</th>
          <td>
            <strong style="color: var(--primary-dark)"
              >{{ info.akurasi }}</strong
            >
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>

{% endblock %}
